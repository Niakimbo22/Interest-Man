<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="coin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Courbe ascendante : le côté "ça monte". Droite et régulière pour que les
       segments visibles de part et d'autre de la pièce se lisent comme UNE seule ligne. -->
  <polyline points="70,400 200,318 330,236 420,180"
            fill="none" stroke="url(#chart)" stroke-width="28"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pointe de flèche -->
  <path d="M362 168 L426 172 L422 236" fill="none" stroke="#22c55e"
        stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pièce, décalée en bas à gauche pour dégager la flèche -->
  <g filter="url(#soft)">
    <circle cx="222" cy="322" r="118" fill="url(#coin)"/>
    <circle cx="222" cy="322" r="118" fill="none" stroke="#92400e" stroke-width="7" opacity="0.55"/>
    <circle cx="222" cy="322" r="96" fill="none" stroke="#92400e" stroke-width="5" opacity="0.3"/>
    <text x="222" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="136"
          font-weight="700" fill="#7c2d12" text-anchor="middle" dominant-baseline="central">€</text>
  </g>
</svg>
