name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/investment-game-pwa-iyt6m4, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # Prerequis : Pages doit etre active a la main une fois, dans
      # Settings > Pages > Source = "GitHub Actions".
      # L'option `enablement: true` ne peut pas s'en charger : creer un site Pages
      # demande des droits admin que GITHUB_TOKEN n'a pas ("Resource not accessible
      # by integration"). Sans cette activation, l'etape ci-dessous echoue.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
